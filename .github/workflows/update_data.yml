name: Daily Data Update

on:
  schedule:
    # Runs at minute 0 past every hour
    - cron: '0 * * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Downloader
        run: |
          python ppfas_downloader.py

      - name: Run Aggregator
        run: |
          python aggregate_portfolio.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add PPFAS_Equity_Analysis.xlsx
          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated hourly update of portfolio data" && git push)
